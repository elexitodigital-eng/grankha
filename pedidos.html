<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Pedidos · panel interno GRANKHA</title>
<link rel="icon" href="favicon.ico">
<style>
 *{box-sizing:border-box}
 :root{--ink:#0B0B0B;--bg:#F5F5F4;--line:#E3E3E1;--mut:#6b6b68;--ok:#1c6b3c;--warn:#8a5a00;--err:#8a2020}
 body{margin:0;background:var(--bg);color:var(--ink);
   font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
   font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
 a{color:inherit}
 header{background:var(--ink);color:#fff;padding:18px 20px}
 .bar{max-width:1180px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
 header .logo{font-size:13px;letter-spacing:7px;font-weight:600}
 header h1{font-size:15px;font-weight:500;margin:0;letter-spacing:-.1px}
 header .sp{flex:1}
 header a{color:#c9c9c7;font-size:13px;text-decoration:none}
 header a:hover{color:#fff}
 main{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
 .card{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:16px}
 .card h2{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
 label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 5px;font-weight:600}
 input,select{width:100%;padding:10px 11px;border:1px solid #cfcfcd;background:#fff;color:var(--ink);
   font:inherit;font-size:14px;border-radius:0}
 input:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
 .row{display:grid;gap:12px;grid-template-columns:1fr}
 @media(min-width:760px){.row{grid-template-columns:repeat(2,1fr)}.row.c4{grid-template-columns:repeat(4,1fr)}}
 button{font:inherit;font-size:14px;padding:10px 16px;border:1px solid var(--ink);background:var(--ink);
   color:#fff;cursor:pointer;border-radius:0;font-weight:500}
 button:hover{background:#000}
 button.sec{background:#fff;color:var(--ink)}
 button.sec:hover{background:#f0f0ee}
 button:disabled{opacity:.45;cursor:not-allowed}
 button.sm{padding:6px 10px;font-size:12.5px}
 .pill{display:inline-block;padding:2px 8px;font-size:11.5px;border:1px solid var(--line);
   background:#fafaf9;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
 .pill.paid{border-color:#bcd8c4;background:#f0f8f2;color:var(--ok)}
 .pill.pending{border-color:#e6d6ab;background:#fdf8ec;color:var(--warn)}
 .pill.shipped{border-color:#bcd0e0;background:#f1f6fb;color:#1d4f77}
 .pill.refunded{border-color:#e2c3c3;background:#fdf3f3;color:var(--err)}
 .st{font-size:13.5px;padding:10px 12px;border-left:3px solid var(--line);background:#fafaf9;margin-bottom:12px}
 .st.ok{border-color:var(--ok);background:#f2f9f4}
 .st.err{border-color:var(--err);background:#fdf4f4}
 .st.warn{border-color:var(--warn);background:#fdf9ee}
 table{width:100%;border-collapse:collapse;font-size:13.5px}
 th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
   padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
 td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
 tr.abierta{background:#fcfcfb}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
 .mut{color:var(--mut)}
 .small{font-size:12.5px}
 .acts{display:flex;gap:6px;flex-wrap:wrap}
 .det{border-top:1px solid var(--line);background:#fafaf9;padding:14px}
 .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
 .kv b{font-weight:600;color:var(--mut)}
 pre{background:#fff;border:1px solid var(--line);padding:12px;font-size:12.5px;
   white-space:pre-wrap;margin:10px 0 0;overflow:auto}
 .hide{display:none}
 .filtro{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
 .filtro select{width:auto}
 code{background:#f0f0ee;padding:1px 5px;font-size:12.5px}
 .warnbox{border-left:3px solid var(--warn);background:#fdf9ee;padding:12px;font-size:13.5px;margin-bottom:16px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">GRANKHA</span>
  <h1>Panel interno de pedidos</h1>
  <span class="sp"></span>
  <a href="index.html">← ver la tienda</a>
</div></header>

<main>
  <div id="aviso" class="st hide"></div>

  <!-- ---------------------------------------------------------- acceso -->
  <div class="card" id="acceso">
    <h2>Acceso</h2>
    <div class="row">
      <div>
        <label for="tok">Token del panel (ADMIN_TOKEN de Vercel)</label>
        <input id="tok" type="password" autocomplete="off" placeholder="grk_…">
      </div>
      <div style="display:flex;align-items:flex-end">
        <button id="entrar" style="width:100%">Entrar y cargar pedidos</button>
      </div>
    </div>
    <p class="small mut" style="margin:12px 0 0">El token se guarda solo en este navegador
      (almacenamiento local). Esta página no contiene ningún secreto: sin el token el servidor
      no devuelve nada.</p>
  </div>

  <!-- ---------------------------------------------------------- listado -->
  <div class="hide" id="panel">
    <div class="card">
      <h2>Estado del correo</h2>
      <div id="correo" class="small mut">—</div>
    </div>

    <div class="card">
      <h2>Pedidos</h2>
      <div class="filtro">
        <label for="f" style="margin:0">Filtrar</label>
        <select id="f">
          <option value="todo">Todos</option>
          <option value="sinenviar">Pagados sin enviar al proveedor</option>
          <option value="sinseguimiento">Enviados sin aviso de seguimiento</option>
          <option value="emailfallido">Con email de pedido fallido</option>
        </select>
        <button class="sec sm" id="refrescar">Refrescar</button>
        <span class="sp" style="flex:1"></span>
        <button class="sec sm" id="salir">Cerrar sesión</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Total</th>
            <th>Estado</th><th>Correos</th><th>Acciones</th>
          </tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p class="small mut" id="vacio" style="margin:14px 0 0"></p>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var API = "api/admin";
  var $ = function (s) { return document.querySelector(s); };
  var pedidos = [];

  function tok() { return localStorage.getItem("grankha_admin_token") || ""; }
  function aviso(txt, tipo) {
    var a = $("#aviso"); a.className = "st " + (tipo || ""); a.textContent = txt;
    if (txt) a.classList.remove("hide"); else a.classList.add("hide");
  }
  function eur(n) { return Number(n || 0).toFixed(2).replace(".", ",") + " €"; }
  function fecha(s) {
    if (!s) return "—";
    var d = new Date(s);
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "2-digit" }) +
      " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[<>&"]/g, function (c) {
      return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c];
    });
  }

  function pedir(body) {
    return fetch(API, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ token: tok() }, body))
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function cargar() {
    aviso("Cargando pedidos…", "");
    return fetch(API + "?token=" + encodeURIComponent(tok()), { cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || "No autorizado");
        pedidos = res.j.pedidos || [];
        var c = res.j.correo || {};
        $("#correo").innerHTML = c.configurado
          ? "Proveedor de correo <b>configurado</b> · remitente <code>" + esc(c.from) + "</code>"
          : "<b style='color:var(--err)'>Correo SIN configurar.</b> Los correos se generan pero no salen.";
        pintar();
        aviso("", "");
      })
      .catch(function (e) {
        aviso("No se pudo entrar: " + e.message, "err");
        $("#panel").classList.add("hide");
        $("#acceso").classList.remove("hide");
      });
  }

  function estado(p) {
    var s = (p.status || "").toLowerCase();
    var clase = { paid: "paid", shipped: "shipped", refunded: "refunded", pending: "pending" }[s] || "";
    return '<span class="pill ' + clase + '">' + esc(s || "—") + "</span>";
  }

  function correos(p) {
    var cli = p.order_email_sent_at
      ? '<span style="color:var(--ok)">✓</span> pedido'
      : (p.order_email_error ? '<span style="color:var(--err)">✗</span> pedido' : '<span class="mut">— pedido</span>');
    var seg = p.tracking_email_sent_at
      ? '<span style="color:var(--ok)">✓</span> seguimiento'
      : '<span class="mut">— seguimiento</span>';
    return '<span class="small">' + cli + "<br>" + seg + "</span>";
  }

  function pintar() {
    var f = $("#f").value;
    var rows = pedidos.filter(function (p) {
      if (f === "sinenviar") return p.status === "paid" && !p.shipped_at;
      if (f === "sinseguimiento") return p.shipped_at && !p.tracking_email_sent_at;
      if (f === "emailfallido") return !!p.order_email_error;
      return true;
    });
    $("#vacio").textContent = rows.length
      ? "" : "No hay pedidos con ese filtro. En cuanto entre el primero aparecerá aquí.";
    $("#lista").innerHTML = rows.map(function (p) {
      var c = p.customer || {};
      var items = (p.order_items || []).map(function (l) {
        return l.qty + " × " + l.sku + " — " + l.name;
      }).join("\n");
      var aw = "PEDIDO GRANKHA " + p.reference +
        "\nDestinatario: " + (c.name || "") +
        "\nDirección: " + [c.address, c.address2].filter(Boolean).join(", ") +
          ", " + (c.zip || "") + " " + (c.city || "") + ", " + (c.province || "") + " " + (c.country || "") +
        "\nTeléfono: " + (c.phone || "—") + "\nEmail: " + (c.email || "—") +
        "\nArtículos:\n  " + items.replace(/\n/g, "\n  ") +
        "\nMétodo de envío: " + (p.shipping_method || "—");
      return '<tr data-ref="' + esc(p.reference) + '">' +
        '<td><span class="num">' + esc(p.reference) + "</span>" +
          (p.supplier_order_id ? '<br><span class="small mut">AW: ' + esc(p.supplier_order_id) + "</span>" : "") + "</td>" +
        "<td>" + fecha(p.created_at) + "</td>" +
        "<td>" + esc(c.name || "—") + '<br><span class="small mut">' + esc(c.email || "") + "</span></td>" +
        "<td><b>" + eur(p.total) + "</b><br><span class='small mut'>" + esc(p.currency || "EUR") + "</span></td>" +
        "<td>" + estado(p) + (p.shipped_at ? '<br><span class="small mut">' + fecha(p.shipped_at) + "</span>" : "") + "</td>" +
        "<td>" + correos(p) + (p.order_email_error ? '<br><span class="small" style="color:var(--err)">' + esc(p.order_email_error).slice(0, 90) + "</span>" : "") + "</td>" +
        '<td><div class="acts">' +
          '<button class="sec sm" data-a="ver">Ver / copiar para AW</button>' +
          '<button class="sm" data-a="enviar">Marcar enviado y avisar</button>' +
          '<button class="sec sm" data-a="rep">Reenviar confirmación</button>' +
          '<button class="sec sm" data-a="resegu">Reenviar seguimiento</button>' +
          '<button class="sec sm" data-a="resventa">Reenviarme el aviso</button>' +
        "</div></td></tr>" +
        '<tr class="hide" data-det="' + esc(p.reference) + '"><td colspan="7"><div class="det">' +
          '<div class="kv">' +
            "<b>Cliente</b><span>" + esc(c.name || "") + " · " + esc(c.email || "") + " · " + esc(c.phone || "—") + "</span>" +
            "<b>Enviar a</b><span>" + esc([c.address, c.address2].filter(Boolean).join(", ")) + ", " + esc(c.zip || "") + " " + esc(c.city || "") + ", " + esc(c.province || "") + " " + esc(c.country || "") + "</span>" +
            "<b>Importes</b><span>venta sin IVA " + eur(Number(p.subtotal) - Number(p.vat_included)) +
              " · IVA " + eur(p.vat_included) + " · envío " + (Number(p.shipping_price) === 0 ? "gratis" : eur(p.shipping_price)) +
              " · <b>total " + eur(p.total) + "</b></span>" +
            "<b>Seguimiento</b><span>" + (p.tracking_code
              ? esc(p.tracking_code) + (p.tracking_carrier ? " · " + esc(p.tracking_carrier) : "") +
                (p.tracking_url ? ' · <a href="' + esc(p.tracking_url) + '" target="_blank" rel="noopener">abrir</a>' : "")
              : "sin número todavía") + "</span>" +
            (p.notes ? "<b>Notas</b><span>" + esc(p.notes) + "</span>" : "") +
          "</div>" +
          "<p class='small mut' style='margin:12px 0 0'>Bloque listo para pegar en el panel de AW Dropshipping:</p>" +
          "<pre>" + esc(aw) + "</pre>" +
          '<button class="sec sm" data-a="copiar" style="margin-top:10px">Copiar el bloque</button>' +
        "</div></td></tr>";
    }).join("");
  }

  // formulario de envío: se abre debajo de la fila elegida
  function abrirEnvio(ref) {
    var viejo = document.querySelector("tr[data-form]");
    if (viejo) viejo.remove();
    var fila = document.querySelector('tr[data-ref="' + CSS.escape(ref) + '"]');
    if (!fila) return;
    var tr = document.createElement("tr");
    tr.setAttribute("data-form", ref);
    tr.innerHTML = '<td colspan="7"><div class="det">' +
      "<h2 style='margin-top:0'>Datos del envío de " + esc(ref) + "</h2>" +
      "<div class='row c4'>" +
        "<div><label>Número de seguimiento *</label><input data-k='tracking_code' placeholder='RB123456789ES'></div>" +
        "<div><label>Transportista</label><input data-k='tracking_carrier' placeholder='Correos Express'></div>" +
        "<div><label>Enlace de seguimiento</label><input data-k='tracking_url' placeholder='https://…'></div>" +
        "<div><label>Pedido en AW (opcional)</label><input data-k='supplier_order_id' placeholder='nº en el panel de AW'></div>" +
      "</div>" +
      "<div class='row' style='margin-top:12px'>" +
        "<div><label>Mensaje de plazo (opcional, sale en el correo)</label>" +
          "<input data-k='tracking_eta' placeholder='Llegará en unos 3-6 días laborables.'></div>" +
      "</div>" +
      "<div class='acts' style='margin-top:14px'>" +
        "<button data-a='confirmar'>Marcar enviado y mandar el correo al cliente</button>" +
        "<button class='sec' data-a='cancelar'>Cancelar</button>" +
      "</div></div></td>";
    fila.after(tr);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-a]");
    if (!b) return;
    var tr = b.closest("tr");
    var ref = (tr && (tr.getAttribute("data-ref") || tr.getAttribute("data-form"))) || "";
    var a = b.getAttribute("data-a");

    if (a === "ver") {
      var d = document.querySelector('tr[data-det="' + CSS.escape(ref) + '"]');
      if (d) d.classList.toggle("hide");
      return;
    }
    if (a === "copiar") {
      var pre = tr.querySelector("pre");
      if (!pre) return;
      navigator.clipboard.writeText(pre.textContent).then(function () {
        aviso("Bloque copiado. Ya puedes pegarlo en el panel de AW Dropshipping.", "ok");
      }, function () { aviso("No se pudo copiar: selecciona el texto a mano.", "err"); });
      return;
    }
    if (a === "enviar") { abrirEnvio(ref); return; }
    if (a === "cancelar") { tr.remove(); return; }

    if (a === "confirmar") {
      var body = { action: "shipped", reference: ref };
      tr.querySelectorAll("input[data-k]").forEach(function (i) {
        if (i.value.trim()) body[i.getAttribute("data-k")] = i.value.trim();
      });
      b.disabled = true;
      aviso("Marcando " + ref + " como enviado y mandando el correo…", "");
      pedir(body).then(function (r) {
        aviso((r.ok ? "✓ " : "⚠ ") + r.mensaje + " → " + r.enviado_a, r.ok ? "ok" : "warn");
        return cargar();
      }).catch(function (err) {
        aviso("No se pudo: " + err.message, "err"); b.disabled = false;
      });
      return;
    }

    var map = { rep: "resend-order", resegu: "resend-tracking", resventa: "resend-sale" };
    if (map[a]) {
      b.disabled = true; aviso("Reenviando…", "");
      pedir({ action: map[a], reference: ref }).then(function (r) {
        aviso("✓ Reenviado a " + r.enviado_a + " (id " + (r.email && r.email.id ? r.email.id : "—") + ")", "ok");
        return cargar();
      }).catch(function (err) { aviso("No se pudo reenviar: " + err.message, "err"); b.disabled = false; });
    }
  });

  $("#entrar").addEventListener("click", function () {
    var t = $("#tok").value.trim();
    if (!t) return aviso("Escribe el token del panel.", "err");
    localStorage.setItem("grankha_admin_token", t);
    $("#acceso").classList.add("hide");
    $("#panel").classList.remove("hide");
    cargar();
  });
  $("#tok").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#entrar").click(); });
  $("#refrescar").addEventListener("click", cargar);
  $("#f").addEventListener("change", pintar);
  $("#salir").addEventListener("click", function () {
    localStorage.removeItem("grankha_admin_token"); location.reload();
  });

  if (tok()) {
    $("#tok").value = tok();
    $("#acceso").classList.add("hide");
    $("#panel").classList.remove("hide");
    cargar();
  }
})();
</script>
</body>
</html>
